spring.application.name=docker-crud-poc
server.port=8080

# ---- H2 (file based, so data survives restarts when a volume is mounted) ----
spring.datasource.url=jdbc:h2:file:./data/employeedb;AUTO_SERVER=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- H2 console (http://localhost:8080/h2-console) ----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ---- Actuator (used by Docker HEALTHCHECK) ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
